# cargo-deny — https://embarkstudios.github.io/cargo-deny/
# From the repo root:
#   cargo deny --manifest-path src-tauri/Cargo.toml check

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # gtk-rs 0.18 / GTK3: Tauri's Linux WebKitGTK backend. Not used on macOS/Windows.
    { id = "RUSTSEC-2024-0411", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0412", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0413", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0414", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0415", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0416", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0417", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0418", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0419", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0420", reason = "gtk-rs GTK3 unmaintained; Tauri Linux WebKitGTK" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; pulled by glib-macros 0.18 (Linux GTK3)" },
    # unic-* via urlpattern → tauri-utils. No upgrade on Tauri 2.11; not in Taurus code.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range unmaintained; transitive via tauri-utils / urlpattern" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common unmaintained; transitive via tauri-utils / urlpattern" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property unmaintained; transitive via tauri-utils / urlpattern" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version unmaintained; transitive via tauri-utils / urlpattern" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident unmaintained; transitive via tauri-utils / urlpattern" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "MPL-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# Tauri 2 pulls several crates at two versions (base64, bitflags, winnow, …).
# Not a vulnerability; do not fail the audit on it.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
