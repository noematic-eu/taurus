<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taurus</title>
    <link rel="icon" href="assets/icon.png" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <main class="wrap">
      <img class="mark" src="assets/icon.png" width="72" height="72" alt="" />
      <p class="kicker">Lecteur de packs</p>
      <h1>Taurus</h1>
      <p class="lede">
        Glisse un dossier de site, un zip ou une archive web <code>.wacz</code>.
        Un dossier est servi tel quel&nbsp;: chaque enregistrement est relu au rechargement.
      </p>

      <button type="button" id="pick-folder" class="drop">
        <span class="drop-title">Ouvrir un dossier</span>
        <span class="drop-hint">ou déposer un dossier, un .zip, un .wacz</span>
      </button>
      <button type="button" id="pick" class="alt">Choisir un .zip ou .wacz</button>
      <button type="button" id="check" class="alt">Vérifier les liens d’une archive</button>

      <div id="loading" class="loading" hidden>
        <p id="loading-label">Ouverture…</p>
        <div
          id="loading-track"
          class="track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div id="loading-bar" class="bar indeterminate"></div>
        </div>
        <p id="loading-detail"></p>
      </div>

      <p id="status" class="status" hidden></p>
    </main>
  </body>
</html>
